<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075bc5">
<title>Gram Price Calculator</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#eef5fc}*{box-sizing:border-box}
body{margin:0}header{background:#075bc5;color:white;padding:20px 17px;font-size:22px;font-weight:700}
main{max-width:540px;margin:auto;padding:15px}.card{background:white;border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:0 4px 16px #1232}
label{display:block;font-weight:700;margin:5px 0 8px}input{width:100%;font-size:22px;padding:12px;border:1px solid #b9c5d3;border-radius:10px;margin-bottom:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.tab,button{border:0;border-radius:10px;padding:13px 8px;font-size:15px;font-weight:700;cursor:pointer}
.tab{background:#e1efff;color:#064ca7}.tab.active{background:#075bc5;color:white}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:13px}.short{background:#e1efff;color:#064ca7}
.primary{width:100%;background:#075bc5;color:white;font-size:18px;padding:15px;margin-bottom:14px}
.result{background:#dcfce5;text-align:center;border-radius:15px;padding:19px;margin-bottom:14px}.result small{font-size:15px}.amount{font-size:36px;font-weight:800;color:#08642a;margin:8px 0}
.row{display:flex;gap:10px}.row button{flex:1}.secondary{background:#e1efff;color:#064ca7}.green{background:#d7f9df;color:#075a24}
h3{margin:0 0 12px}.history-item{border-bottom:1px solid #e5eaf0;padding:11px 0;display:flex;justify-content:space-between;gap:10px}.history-item strong{color:#08732b;white-space:nowrap}
.muted{color:#667085;font-size:13px}.clear{background:#fee2e2;color:#991b1b;margin-top:10px}.hidden{display:none}
</style></head>
<body>
<header>₹ Gram Price Calculator</header>
<main>
<section class="card">
 <div class="tabs"><button class="tab active" id="tabGram">Gram → Rupees</button><button class="tab" id="tabMoney">Rupees → Gram</button></div>
 <label for="kgPrice">1 KG ka price (₹)</label><input id="kgPrice" type="number" min="0" step="0.01" value="675" inputmode="decimal">
 <div id="gramPanel">
  <label for="grams">Kitne gram chahiye?</label><input id="grams" type="number" min="0" step="any" value="150" inputmode="decimal">
  <div class="shortcuts"><button class="short" data-g="50">50 g</button><button class="short" data-g="100">100 g</button><button class="short" data-g="200">200 g</button><button class="short" data-g="250">250 g</button><button class="short" data-g="500">500 g</button><button class="short" data-g="750">750 g</button><button class="short" data-g="1000">1 kg</button><button class="short" id="other">Other</button></div>
 </div>
 <div id="moneyPanel" class="hidden"><label for="rupees">Kitne rupees ka chahiye? (₹)</label><input id="rupees" type="number" min="0" step="0.01" value="100" inputmode="decimal"></div>
</section>
<button class="primary" id="calc">Calculate</button>
<section class="result"><small id="resultLabel">Total price</small><div class="amount" id="result">₹101.25</div><small id="details">150 gram ka price</small></section>
<div class="row"><button class="secondary" id="reset">Reset</button><button class="green" id="copy">Copy Result</button></div>
<section class="card" style="margin-top:16px"><h3>Calculation History</h3><div id="history"></div><button class="clear" id="clear">Clear History</button></section>
<p class="muted">Formula: (1 kg ka price × gram) ÷ 1000</p>
</main>
<script>
const $=id=>document.getElementById(id);let mode='gram';
let history=JSON.parse(localStorage.getItem('gramPriceHistoryV2')||'[]');
const money=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function setMode(m){mode=m;$('tabGram').classList.toggle('active',m==='gram');$('tabMoney').classList.toggle('active',m==='money');$('gramPanel').classList.toggle('hidden',m!=='gram');$('moneyPanel').classList.toggle('hidden',m!=='money');$('resultLabel').textContent=m==='gram'?'Total price':'Aapko kitna gram milega?';calculate(false)}
function calculate(save=true){
 const price=parseFloat($('kgPrice').value);if(!Number.isFinite(price)||price<=0){$('result').textContent='Valid price daalein';return}
 let input,total,label,detail;
 if(mode==='gram'){input=parseFloat($('grams').value);if(!Number.isFinite(input)||input<0){$('result').textContent='Valid gram daalein';return}total=price*input/1000;label=money(total);detail=`${input} gram ka price`; }
 else{input=parseFloat($('rupees').value);if(!Number.isFinite(input)||input<0){$('result').textContent='Valid rupees daalein';return}total=input*1000/price;label=Number(total).toLocaleString('en-IN',{maximumFractionDigits:2})+' gram';detail=`${money(input)} mein itna milega`; }
 $('result').textContent=label;$('details').textContent=detail;
 if(save){history.unshift({mode,price,input,total,when:new Date().toLocaleString()});history=history.slice(0,50);localStorage.setItem('gramPriceHistoryV2',JSON.stringify(history));renderHistory()}
}
function renderHistory(){$('history').innerHTML=history.length?history.map(x=>`<div class="history-item"><div><div class="muted">${x.when}</div>1 kg: ${money(x.price)}<br>${x.mode==='gram'?x.input+' g':'₹'+x.input+' ka gram'}</div><strong>${x.mode==='gram'?money(x.total):Number(x.total).toLocaleString('en-IN',{maximumFractionDigits:2})+' g'}</strong></div>`).join(''):'<p class="muted">Abhi koi history nahi hai.</p>'}
$('tabGram').onclick=()=>setMode('gram');$('tabMoney').onclick=()=>setMode('money');$('calc').onclick=()=>calculate(true);
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{$('grams').value=b.dataset.g;setMode('gram');calculate(false)});
$('other').onclick=()=>$('grams').focus();
$('reset').onclick=()=>{$('kgPrice').value='';$('grams').value='';$('rupees').value='';$('result').textContent='₹0.00';$('details').textContent='Values daal kar Calculate dabayein'};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('result').textContent);$('copy').textContent='Copied!';setTimeout(()=>$('copy').textContent='Copy Result',1200)}catch(e){alert('Result: '+$('result').textContent)}};
$('clear').onclick=()=>{history=[];localStorage.removeItem('gramPriceHistoryV2');renderHistory()};renderHistory();calculate(false);
</script></body></html>
